baseURL = 'https://blog.lex.la/'
theme = 'PaperMod'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = [":git", "lastmod", "date", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]

[permalinks]
posts = "/:year/:month/:slug/"

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
author = "Aleksei Sviridkin"

[params.label]
icon = "avatar.jpg"
iconHeight = 30

defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = true
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[[params.socialIcons]]
name = "github"
url = "https://github.com/lexfrei"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/lexfrei"

[[params.socialIcons]]
name = "telegram"
url = "https://t.me/lexfrei"

[[params.socialIcons]]
name = "instagram"
url = "https://www.instagram.com/lexfrei"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[[params.socialIcons]]
name = "email"
url = "mailto:f@lex.la"

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1
    title = "Electric Dreams of the Simulacra Shepherd"

    [languages.en.params]
      description = "Personal blog about SRE, DevOps, and other tech stuff"
      images = ["/og-en.png"]

    [languages.en.params.homeInfoParams]
      Title = "Hi, I'm Aleksei 👋"
      Content = """
SRE and platform engineer at Ænix, Tbilisi. Proud dog dad. 🐕

Maintainer of Cozystack (CNCF Sandbox), where I also lead the GPU/AI track. Patches in the Linux kernel and Git, printer boards in Armbian, and a long tail of controllers, charts, and MCP servers.

Writing here about infrastructure, reliability, Kubernetes, open source as practice, and herding LLMs.

🔗 [awesome.lexfrei.dev](https://awesome.lexfrei.dev) · all projects | [me.lex.la](https://me.lex.la) · contacts and PGP
"""

  [[languages.en.menu.main]]
    name = "Projects"
    url = "/en/projects/"
    weight = 10

  [languages.ru]
    languageName = "Русский"
    languageCode = "ru-ru"
    weight = 2
    title = "Электросны Погонщика Симулякров"

    [languages.ru.params]
      description = "Личный блог про SRE, DevOps и другие технологии"
      images = ["/og-ru.png"]

    [languages.ru.params.homeInfoParams]
      Title = "Привет, я Алексей 👋"
      Content = """
SRE и платформенный инженер в Ænix, Тбилиси. Гордый отец псына. 🐕

Мейнтейнер Cozystack (CNCF Sandbox), там же веду GPU/AI-трек. Патчи в ядро Linux и Git, платы принтеров в Armbian и длинный хвост контроллеров, чартов и MCP-серверов.

Пишу здесь про инфраструктуру, надёжность, Kubernetes, опенсорс как практику и работу погонщика симулякров.

🔗 [awesome.lexfrei.dev](https://awesome.lexfrei.dev) · все проекты | [me.lex.la](https://me.lex.la) · контакты и PGP
"""

  [[languages.ru.menu.main]]
    name = "Проекты"
    url = "/ru/projects/"
    weight = 10
